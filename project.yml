name: QBManager
options:
  bundleIdPrefix: com.micat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "5"
    DEVELOPMENT_TEAM: ""
targets:
  QBManager:
    type: application
    platform: iOS
    sources:
      - path: QBManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.micat.qbmanager
        PRODUCT_NAME: QBManager
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: QBManager/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: QBManager/Info.plist
      properties:
        CFBundleDisplayName: QB 管理
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleAllowMixedLocalizations: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 不可同時設定 NSAllowsLocalNetworking：iOS 10+ 只要有它，NSAllowsArbitraryLoads 就會被忽略，
        # 導致 nas.lan、DDNS 等網域的 HTTP 連線被 ATS 擋下
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: 需要存取區域網路以連線到 qBittorrent WebUI
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.bittorrent.torrent
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent File
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - torrent
              public.mime-type:
                - application/x-bittorrent
        CFBundleURLTypes:
          - CFBundleURLName: magnet
            CFBundleURLSchemes:
              - magnet
  QBManagerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: QBManagerUITests
    dependencies:
      - target: QBManager
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.micat.qbmanager.uitests
        TEST_TARGET_NAME: QBManager
        CODE_SIGN_STYLE: Automatic
schemes:
  QBManager:
    build:
      targets:
        QBManager: all
        QBManagerUITests: [test]
    test:
      targets:
        - QBManagerUITests
